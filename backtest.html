<script>
const COST = 0.0015; // 0.15% round-trip cost

// ===== DATA FETCH =====
function fetchJSONP(url, timeout) {
return new Promise((resolve, reject) => {
const cb = '_eb_' + (++window._cbCnt);
const s = document.createElement('script');
const t = setTimeout(() => { cleanup(); reject(new Error('timeout')); }, timeout);
function cleanup() { clearTimeout(t); delete window[cb]; s.remove(); }
window[cb] = d => { cleanup(); resolve(d); };
s.onerror = () => { cleanup(); reject(new Error('network')); };
s.src = url + '&cb=' + cb;
document.head.appendChild(s);
});
}
window._cbCnt = 0;

async function fetchKline(secid, beg) {
const url = `https://push2his.eastmoney.com/api/qt/stock/kline/get?secid=${secid}&fields1=f1,f2,f3,f4,f5,f6&fields2=f51,f52,f53,f54,f55,f56,f57,f58,f59,f60,f61&klt=101&fqt=1&beg=${beg}&end=20260527&lmt=5000`;
const d = await fetchJSONP(url, 12000);
if (!d || !d.data || !d.data.klines || d.data.klines.length < 50) throw new Error('insufficient data');
return d.data.klines.map(k => {
const p = k.split(',');
return { date: p[0], open: +p[1], close: +p[2], high: +p[3], low: +p[4], vol: +p[5], amt: +p[6] };
});
}

// ===== INDICATORS =====
function sma(a, p) { const r=Array(a.length).fill(null); for(let i=p-1;i<a.length;i++){let s=0;for(let j=i-p+1;j<=i;j++)s+=a[j];r[i]=s/p;} return r; }
function ema(a, p) { const r=Array(a.length).fill(null),k=2/(p+1); r[p-1]=a.slice(0,p).reduce((x,y)=>x+y)/p; for(let i=p;i<a.length;i++)r[i]=a[i]*k+r[i-1]*(1-k); return r; }
function rsi(a, p=14) {
const r=Array(a.length).fill(null),g=[],l=[];
for(let i=1;i<a.length;i++){const d=a[i]-a[i-1];g.push(Math.max(d,0));l.push(Math.max(-d,0));}
if(g.length<p)return r;
let ag=g.slice(0,p).reduce((x,y)=>x+y)/p, al=l.slice(0,p).reduce((x,y)=>x+y)/p;
r[p]=al===0?100:100-100/(1+ag/al);
for(let i=p;i<g.length;i++){ag=(ag*(p-1)+g[i])/p;al=(al*(p-1)+l[i])/p;r[i+1]=al===0?100:100-100/(1+ag/al);}
return r;
}
function bias(a, p) { const m=sma(a,p); return a.map((v,i)=>m[i]!==null?(v-m[i])/m[i]*100:null); }
function kdj(h,l,c,n=9) {
const k=Array(c.length).fill(50),d=Array(c.length).fill(50),j=Array(c.length).fill(50);
for(let i=n-1;i<c.length;i++){const ln=Math.min(...l.slice(i-n+1,i+1)),hn=Math.max(...h.slice(i-n+1,i+1)),rsv=hn===ln?50:(c[i]-ln)/(hn-ln)*100;k[i]=i===n-1?rsv:2/3*k[i-1]+1/3*rsv;d[i]=i===n-1?rsv:2/3*d[i-1]+1/3*k[i];j[i]=3*k[i]-2*d[i];}
return {k,d,j};
}
function macd(c) {
const ef=ema(c,12),es=ema(c,26),dif=c.map((_,i)=>ef[i]!==null&&es[i]!==null?ef[i]-es[i]:null);
const vs=dif.findIndex(v=>v!==null),dea=Array(c.length).fill(null);
if(vs>=0){let cnt=0,sum=0;for(let i=vs;i<c.length&&cnt<9;i++){sum+=dif[i];cnt++;}dea[vs+8]=sum/9;for(let i=vs+9;i<c.length;i++)dea[i]=dif[i]*2/10+dea[i-1]*8/10;}
const bar=c.map((_,i)=>dif[i]!==null&&dea[i]!==null?2*(dif[i]-dea[i]):null);
return {dif,dea,bar};
}
function bb(c,p=20,m=2) {
const ma=sma(c,p),u=Array(c.length).fill(null),lo=Array(c.length).fill(null),pb=Array(c.length).fill(null);
for(let i=p-1;i<c.length;i++){const w=c.slice(i-p+1,i+1),st=Math.sqrt(w.reduce((s,v)=>s+(v-ma[i])**2,0)/p);u[i]=ma[i]+m*st;lo[i]=ma[i]-m*st;pb[i]=u[i]!==lo[i]?(c[i]-lo[i])/(u[i]-lo[i]):.5;}
return {ma,u,lo,pb};
}
function volR(v,p=5){return v.map((x,i)=>i<p?null:(()=>{const a=v.slice(i-p,i).reduce((s,w)=>s+w)/p;return a>0?x/a:null;})());}
function atr(h,l,c,p=14) {
const tr=Array(c.length).fill(null);
for(let i=1;i<c.length;i++)tr[i]=Math.max(h[i]-l[i],Math.abs(h[i]-c[i-1]),Math.abs(l[i]-c[i-1]));
return sma(tr,p);
}
function williams(h,l,c,p=14) {
const r=Array(c.length).fill(null);
for(let i=p-1;i<c.length;i++){const hh=Math.max(...h.slice(i-p+1,i+1)),ll=Math.min(...l.slice(i-p+1,i+1));r[i]=hh===ll?-50:(c[i]-hh)/(hh-ll)*-100;}
return r;
}

// ===== SIGNAL DEFINITIONS =====
function getBuySignals(d, ind) {
const S = [];
const rsi7=ind.rsi7, rsi14=ind.rsi14, rsi21=ind.rsi21;
const b5=ind.bias5, b10=ind.bias10, b20=ind.bias20, b60=ind.bias60;
const kdjJ=ind.kdj.j, macdBar=ind.macd.bar, macdDif=ind.macd.dif, macdDea=ind.macd.dea;
const bbPb=ind.bb.pb, vr=ind.vr, w=ind.will, ma5=ind.ma5, ma10=ind.ma10, ma20=ind.ma20, ma60=ind.ma60;
const closes=d.map(x=>x.close);

// Single RSI
for(const th of [15,20,25,30]) S.push({name:`RSI7<${th}`,fn:i=>rsi7[i]!==null&&rsi7[i]<th});
for(const th of [25,30,35,40]) S.push({name:`RSI14<${th}`,fn:i=>rsi14[i]!==null&&rsi14[i]<th});
for(const th of [30,35,40]) S.push({name:`RSI21<${th}`,fn:i=>rsi21[i]!==null&&rsi21[i]<th});

// Single BIAS
for(const th of [-1.5,-2,-3,-4]) S.push({name:`BIAS5<${th}%`,fn:i=>b5[i]!==null&&b5[i]<th});
for(const th of [-2,-3,-4,-5]) S.push({name:`BIAS10<${th}%`,fn:i=>b10[i]!==null&&b10[i]<th});
for(const th of [-2,-3,-4,-5,-6]) S.push({name:`BIAS20<${th}%`,fn:i=>b20[i]!==null&&b20[i]<th});
for(const th of [-5,-8,-10]) S.push({name:`BIAS60<${th}%`,fn:i=>b60[i]!==null&&b60[i]<th});

// Single KDJ
for(const th of [-10,0,10,20]) S.push({name:`KDJ-J<${th}`,fn:i=>kdjJ[i]!==null&&kdjJ[i]<th});

// MACD
S.push({name:'MACD金叉',fn:i=>i>0&&macdDif[i]!==null&&macdDea[i]!==null&&macdDif[i]>macdDea[i]&&macdDif[i-1]!==null&&macdDea[i-1]!==null&&macdDif[i-1]<=macdDea[i-1]});
S.push({name:'MACD柱转正',fn:i=>i>0&&macdBar[i]!==null&&macdBar[i-1]!==null&&macdBar[i]>0&&macdBar[i-1]<=0});

// Bollinger
for(const th of [-0.1,0,0.1,0.2]) S.push({name:`BB%B<${th}`,fn:i=>bbPb[i]!==null&&bbPb[i]<th});

// Williams
for(const th of [-90,-80,-70]) S.push({name:`WR<${th}`,fn:i=>w[i]!==null&&w[i]<th});

// Trend pullback
S.push({name:'价格>MA60 & RSI14<40',fn:i=>ma60[i]!==null&&rsi14[i]!==null&&closes[i]>ma60[i]&&rsi14[i]<40});

// Dual combinations
S.push({name:'BIAS20<-3 & RSI14<35',fn:i=>b20[i]<-3&&rsi14[i]<35&&rsi14[i]!==null});
S.push({name:'BIAS20<-2 & RSI14<35',fn:i=>b20[i]<-2&&rsi14[i]<35&&rsi14[i]!==null});
S.push({name:'BIAS20<-3 & KDJ-J<0',fn:i=>b20[i]<-3&&kdjJ[i]<0});
S.push({name:'BIAS20<-2 & KDJ-J<10',fn:i=>b20[i]<-2&&kdjJ[i]<10});
S.push({name:'RSI14<30 & MACD金叉',fn:i=>{if(i<1||rsi14[i]===null)return false;return rsi14[i]<30&&macdDif[i]>macdDea[i]&&macdDif[i-1]<=macdDea[i-1];}});
S.push({name:'RSI14<35 & BB%B<0.1',fn:i=>rsi14[i]<35&&rsi14[i]!==null&&bbPb[i]<0.1&&bbPb[i]!==null});
S.push({name:'BIAS10<-2 & 量比>1.5',fn:i=>b10[i]<-2&&b10[i]!==null&&vr[i]>1.5&&vr[i]!==null});
S.push({name:'MA5上穿MA20 & RSI14<50',fn:i=>i>0&&ma5[i]>ma20[i]&&ma5[i-1]<=ma20[i-1]&&rsi14[i]<50&&rsi14[i]!==null});
S.push({name:'MACD金叉 & RSI14<45',fn:i=>i>0&&macdDif[i]>macdDea[i]&&macdDif[i-1]<=macdDea[i-1]&&rsi14[i]<45&&rsi14[i]!==null});
S.push({name:'WR<-80 & BIAS20<-3',fn:i=>w[i]<-80&&w[i]!==null&&b20[i]<-3&&b20[i]!==null});
S.push({name:'RSI7<20 & RSI14<35',fn:i=>rsi7[i]<20&&rsi7[i]!==null&&rsi14[i]<35&&rsi14[i]!==null});
S.push({name:'KDJ-J<0 & MACD柱↑',fn:i=>i>0&&kdjJ[i]<0&&macdBar[i]!==null&&macdBar[i-1]!==null&&macdBar[i]>macdBar[i-1]});
S.push({name:'BIAS20<-3 & BB%B<0',fn:i=>b20[i]<-3&&b20[i]!==null&&bbPb[i]<0&&bbPb[i]!==null});
S.push({name:'上穿MA20 & 量比>1.3',fn:i=>i>0&&closes[i]>ma20[i]&&closes[i-1]<=ma20[i-1]&&vr[i]>1.3&&vr[i]!==null});
return S;
}

function getSellSignals(d, ind) {
const S = [];
const rsi14=ind.rsi14, b20=ind.bias20, kdjJ=ind.kdj.j;
const macdDif=ind.macd.dif, macdDea=ind.macd.dea, macdBar=ind.macd.bar, bbPb=ind.bb.pb, w=ind.will;
S.push({name:'RSI14>70',fn:i=>rsi14[i]>70&&rsi14[i]!==null});
S.push({name:'RSI14>65',fn:i=>rsi14[i]>65&&rsi14[i]!==null});
S.push({name:'BIAS20>3%',fn:i=>b20[i]>3&&b20[i]!==null});
S.push({name:'BIAS20>4%',fn:i=>b20[i]>4&&b20[i]!==null});
S.push({name:'KDJ-J>100',fn:i=>kdjJ[i]>100});
S.push({name:'BB%B>1',fn:i=>bbPb[i]>1&&bbPb[i]!==null});
S.push({name:'MACD死叉',fn:i=>i>0&&macdDif[i]<macdDea[i]&&macdDif[i-1]>=macdDea[i-1]&&macdDif[i]!==null});
S.push({name:'MACD柱转负',fn:i=>i>0&&macdBar[i]<0&&macdBar[i-1]>=0&&macdBar[i]!==null});
S.push({name:'WR>-10',fn:i=>w[i]>-10&&w[i]!==null});
S.push({name:'RSI14>65 & BIAS20>3',fn:i=>rsi14[i]>65&&rsi14[i]!==null&&b20[i]>3&&b20[i]!==null});
S.push({name:'KDJ-J>80 & MACD死叉',fn:i=>i>0&&kdjJ[i]>80&&macdDif[i]<macdDea[i]&&macdDif[i-1]>=macdDea[i-1]&&macdDif[i]!==null});
return S;
}

// ===== BACKTEST ENGINE =====
function backtestBuy(data, signalFn, holdDays) {
const trades = [];
for (let i = 60; i < data.length - holdDays; i++) {
if (signalFn(i)) {
const entry = data[i].close, exit = data[i + holdDays].close;
const ret = (exit - entry) / entry - COST;
trades.push({ entryIdx: i, exitIdx: i + holdDays, entryDate: data[i].date, exitDate: data[i + holdDays].date, entry, exit, ret });
}
}
const wins = trades.filter(t => t.ret > 0);
const avgRet = trades.length ? trades.reduce((s, t) => s + t.ret, 0) / trades.length : 0;
const winRate = trades.length ? wins.length / trades.length * 100 : 0;
const maxWin = trades.length ? Math.max(...trades.map(t => t.ret)) * 100 : 0;
const maxLoss = trades.length ? Math.min(...trades.map(t => t.ret)) * 100 : 0;
const score = winRate * 0.3 + avgRet * 1500 + (trades.length >= 5 ? 10 : trades.length * 2) + maxLoss * 3;
return { trades, winRate, avgRet: avgRet * 100, maxWin, maxLoss, count: trades.length, score, avgRetNet: avgRet * 100 };
}

function backtestCombo(data, buyFn, sellFn, maxHold) {
const trades = [];
let i = 60;
while (i < data.length - 1) {
if (buyFn(i)) {
const entry = data[i].close;
let exitIdx = -1;
for (let j = i + 1; j < Math.min(i + maxHold, data.length); j++) {
if (sellFn(j)) { exitIdx = j; break; }
}
if (exitIdx < 0) exitIdx = Math.min(i + maxHold, data.length - 1);
const exit = data[exitIdx].close;
const ret = (exit - entry) / entry - COST;
trades.push({ entryIdx: i, exitIdx, entryDate: data[i].date, exitDate: data[exitIdx].date, entry, exit, ret });
i = exitIdx + 1;
} else i++;
}
if (trades.length < 2) return null;
let cumRet = 1, peak = 1, maxDD = 0;
const equity = [{ x: 0, y: 1 }];
trades.forEach((t, idx) => { cumRet *= (1 + t.ret); if (cumRet > peak) peak = cumRet; const dd = (peak - cumRet) / peak; if (dd > maxDD) maxDD = dd; equity.push({ x: idx + 1, y: cumRet }); });
const totalRet = (cumRet - 1) * 100;
const years = (data[trades[trades.length - 1].exitIdx].date - data[trades[0].entryIdx].date) / 365.25 / 86400000 || 1;
const cagr = (Math.pow(cumRet, 1 / Math.max(years, 0.5)) - 1) * 100;
const wins = trades.filter(t => t.ret > 0).length;
const winRate = wins / trades.length * 100;
const avgRet = trades.reduce((s, t) => s + t.ret, 0) / trades.length * 100;
const stdDev = Math.sqrt(trades.reduce((s, t) => s + (t.ret * 100 - avgRet) ** 2, 0) / trades.length);
const sharpe = stdDev > 0 ? avgRet / stdDev : 0;
return { totalRet, cagr, maxDD: maxDD * 100, winRate, count: trades.length, sharpe, trades, equity, avgRet };
}

// ===== RENDER =====
let ALL_DATA = {}, ALL_IND = {}, BUY_RESULTS = {}, SELL_RESULTS = {};

function renderRank(target) {
const results = BUY_RESULTS[target] || [];
const minT = +document.getElementById('selMinTrades').value;
const filtered = results.filter(r => r.count >= minT);
const body = document.getElementById('rankBody');
body.innerHTML = filtered.slice(0, 50).map((r, i) => {
const rc = r.avgRetNet >= 0 ? 'g' : 'r';
return `<tr><td class="rank">${i + 1}</td><td>${r.sigName}</td><td>${r.hold}天</td><td>${r.winRate.toFixed(1)}%</td><td class="${rc}">${r.avgRetNet >= 0 ? '+' : ''}${r.avgRetNet.toFixed(2)}%</td><td class="${rc}">${r.avgRetNet >= 0 ? '+' : ''}${(r.avgRetNet).toFixed(2)}%</td><td>${r.count}</td><td>${r.score.toFixed(1)}</td></tr>`;
}).join('');
if (!filtered.length) body.innerHTML = '<tr><td colspan="8" style="text-align:center;color:var(--dim)">无满足条件的信号</td></tr>';
}

function renderTop(target, idx) {
const results = (BUY_RESULTS[target] || []).filter(r => r.count >= 5);
if (idx >= results.length) return;
const r = results[idx];
const d = ALL_DATA[target];
document.getElementById('topDetail').innerHTML = `
<p><strong class="b">${r.sigName}</strong> · 持有${r.hold}天</p>
<p>胜率: <span class="g">${r.winRate.toFixed(1)}%</span> | 均收益: <span class="${r.avgRetNet>=0?'g':'r'}">${r.avgRetNet>=0?'+':''}${r.avgRetNet.toFixed(2)}%</span></p>
<p>最大盈: <span class="g">+${r.maxWin.toFixed(2)}%</span> | 最大亏: <span class="r">${r.maxLoss.toFixed(2)}%</span> | 交易: ${r.count}次</p>
<p>得分: <span class="y">${r.score.toFixed(1)}</span></p>`;
const log = document.getElementById('tradeLog');
log.innerHTML = r.trades.slice(-30).map((t, i) => `<tr><td>${i+1}</td><td>${t.entryDate}</td><td>${t.exitDate}</td><td>${t.entry.toFixed(3)}</td><td>${t.exit.toFixed(3)}</td><td class="${t.ret>=0?'g':'r'}">${t.ret>=0?'+':''}${(t.ret*100).toFixed(2)}%</td></tr>`).join('');
// Draw equity
const canvas = document.getElementById('equityCanvas');
const ctx = canvas.getContext('2d');
canvas.width = canvas.offsetWidth * 2; canvas.height = 400;
ctx.clearRect(0, 0, canvas.width, canvas.height);
let cum = 1; const eq = [1];
r.trades.forEach(t => { cum *= (1 + t.ret); eq.push(cum); });
const minV = Math.min(...eq) * 0.95, maxV = Math.max(...eq) * 1.05;
const scaleX = canvas.width / (eq.length - 1), scaleY = canvas.height / (maxV - minV || 1);
ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 2; ctx.beginPath();
eq.forEach((v, i) => { const x = i * scaleX, y = canvas.height - (v - minV) * scaleY; i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y); });
ctx.stroke();
// Zero line
ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.lineWidth = 1; ctx.beginPath();
const zeroY = canvas.height - (1 - minV) * scaleY; ctx.moveTo(0, zeroY); ctx.lineTo(canvas.width, zeroY); ctx.stroke();
}

function renderSell(target) {
const results = SELL_RESULTS[target] || [];
const body = document.getElementById('sellBody');
body.innerHTML = results.slice(0, 30).map((r, i) => {
const rc = r.avgRet >= 0 ? 'g' : 'r';
return `<tr><td class="rank">${i + 1}</td><td>${r.sigName} (${r.hold}天)</td><td>${r.winRate.toFixed(1)}%</td><td class="${rc}">${r.avgRet>=0?'+':''}${r.avgRet.toFixed(2)}%</td><td>${r.count}</td><td>${r.score.toFixed(1)}</td></tr>`;
}).join('');
}

function renderCombo(target) {
const combos = COMBO_RESULTS[target] || [];
const body = document.getElementById('comboBody');
body.innerHTML = combos.slice(0, 20).map((c, i) => {
const rc = c.totalRet >= 0 ? 'g' : 'r';
return `<tr><td class="rank">${i+1}</td><td>${c.buyName}</td><td>${c.sellName}</td><td class="${rc}">${c.totalRet>=0?'+':''}${c.totalRet.toFixed(1)}%</td><td class="${rc}">${c.cagr>=0?'+':''}${c.cagr.toFixed(1)}%</td><td class="r">-${c.maxDD.toFixed(1)}%</td><td>${c.winRate.toFixed(1)}%</td><td>${c.count}</td><td>${c.sharpe.toFixed(2)}</td></tr>`;
}).join('');
if (!combos.length) body.innerHTML = '<tr><td colspan="9" style="text-align:center;color:var(--dim)">计算中...</td></tr>';
}

function renderNow(target) {
const d = ALL_DATA[target], ind = ALL_IND[target];
if (!d || !ind) return;
const last = d.length - 1;
const buySigs = getBuySignals(d, ind);
const sellSigs = getSellSignals(d, ind);
const triggered = [];
buySigs.forEach(s => { try { if (s.fn(last)) triggered.push({ name: s.name, type: 'buy' }); } catch(e){} });
sellSigs.forEach(s => { try { if (s.fn(last)) triggered.push({ name: s.name, type: 'sell' }); } catch(e){} });
const el = document.getElementById('nowSignals');
if (!triggered.length) {
el.innerHTML = '<p style="font-size:16px;text-align:center;padding:20px">⚪ 当前无信号触发</p><p class="info">所有买入和卖出信号均未触发，维持当前仓位。</p>';
} else {
el.innerHTML = triggered.map(t => {
const cls = t.type === 'buy' ? 'badge-g' : 'badge-r';
const icon = t.type === 'buy' ? '🟢' : '🔴';
return `<div style="padding:8px 0;border-bottom:1px solid rgba(255,255,255,.05)">${icon} <span class="badge ${cls}">${t.type === 'buy' ? '买入' : '卖出'}</span> <strong>${t.name}</strong></div>`;
}).join('');
}
}

let COMBO_RESULTS = {};

async function runBacktest(target, data) {
const closes = data.map(d => d.close), highs = data.map(d => d.high), lows = data.map(d => d.low), vols = data.map(d => d.vol);
const ind = {
rsi7: rsi(closes, 7), rsi14: rsi(closes, 14), rsi21: rsi(closes, 21),
bias5: bias(closes, 5), bias10: bias(closes, 10), bias20: bias(closes, 20), bias60: bias(closes, 60),
kdj: kdj(highs, lows, closes), macd: macd(closes), bb: bb(closes),
vr: volR(vols), will: williams(highs, lows, closes),
ma5: sma(closes, 5), ma10: sma(closes, 10), ma20: sma(closes, 20), ma60: sma(closes, 60)
};
ALL_DATA[target] = data; ALL_IND[target] = ind;

// Buy signals
const buyDefs = getBuySignals(data, ind);
const buyResults = [];
for (const sig of buyDefs) {
for (const hold of [5, 10, 15, 20, 30, 40, 60]) {
try {
const r = backtestBuy(data, sig.fn, hold);
if (r.count >= 3) buyResults.push({ sigName: sig.name, hold, ...r });
} catch(e){}
}
}
buyResults.sort((a, b) => b.score - a.score);
BUY_RESULTS[target] = buyResults;

// Sell signals
const sellDefs = getSellSignals(data, ind);
const sellResults = [];
for (const sig of sellDefs) {
for (const hold of [5, 10, 15, 20]) {
try {
const r = backtestBuy(data, sig.fn, hold);
if (r.count >= 3) sellResults.push({ sigName: sig.name, hold, ...r });
} catch(e){}
}
}
sellResults.sort((a, b) => b.score - a.score);
SELL_RESULTS[target] = sellResults;

// Combo optimization
const topBuy = buyResults.filter(r => r.count >= 5).slice(0, 8);
const topSell = sellResults.filter(r => r.count >= 3).slice(0, 8);
const combos = [];
for (const b of topBuy) {
for (const s of topSell) {
const buyFn = buyDefs.find(d => d.name === b.sigName)?.fn;
const sellFn = sellDefs.find(d => d.name === s.sigName)?.fn;
if (!buyFn || !sellFn) continue;
try {
const r = backtestCombo(data, buyFn, sellFn, b.hold);
if (r && r.count >= 2) combos.push({ buyName: b.sigName, sellName: s.sigName, maxHold: b.hold, ...r });
} catch(e){}
}
}
combos.sort((a, b) => (b.totalRet / Math.max(b.maxDD, 1)) - (a.totalRet / Math.max(a.maxDD, 1)));
COMBO_RESULTS[target] = combos;
}
